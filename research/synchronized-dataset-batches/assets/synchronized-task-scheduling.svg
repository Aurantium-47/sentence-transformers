<text x="842" y="243" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#18283b" text-anchor="start">PROPOSED · same-task rank slots</text>
<text x="82" y="283" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#566579" text-anchor="start">Batch stream before rank sharding</text>
