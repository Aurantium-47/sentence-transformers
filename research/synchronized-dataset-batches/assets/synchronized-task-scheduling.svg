<text x="78" y="160" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#17619b" text-anchor="start">Task A: retrieval / all_gather</text>
<text x="530" y="160" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#925c13" text-anchor="start">Task B: similarity / no all_gather</text>
<text x="1120" y="160" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#566579" text-anchor="start">A₀, A₁: distinct batches</text>
