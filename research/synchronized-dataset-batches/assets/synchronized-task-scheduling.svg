<text x="56" y="63" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#18283b" text-anchor="start">Align tasks across ranks before sharding</text>
<text x="56" y="103" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#566579" text-anchor="start">Sentence Transformers · two-rank scheduling schematic (W = 2) · not a timing diagram</text>
