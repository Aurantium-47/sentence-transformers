<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Align tasks across ranks before sharding</title>
<desc id="desc">Illustrative two-rank scheduling comparison. Interleaved A0 B0 A1 B1 sends task A to rank 0 and B to rank 1. Synchronized rank slots A0 A1 B0 B1 align task A on both ranks, then task B. Slots contain distinct batches, not replicated samples. Task A can use eight examples per rank and task B two. Eighteen real CPU Gloo two-process Trainer jobs cover six configurations times full, prefix and resume. No performance or GPU claim.</desc>
